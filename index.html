<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8" />
  <!-- Política de seguridad de contenido: sólo código propio; datos sólo con Supabase. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.googleusercontent.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5" />
  <title>PescaCorral · Reservas y permisos de pesca</title>
  <meta name="description" content="Gestión digital de reservas de pesca deportiva y permisos municipales en el Dique Cabra Corral." />

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#3B0D14" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PescaCorral" />
  <meta name="mobile-web-app-capable" content="yes" />

  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Punto de montaje de la aplicación -->
  <div id="app" aria-live="polite">
    <div class="boot">
      <div class="boot__logo" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="56" height="56"><use href="#logo-mark"></use></svg>
      </div>
      <p>Cargando PescaCorral…</p>
    </div>
  </div>

  <!-- Contenedor para notificaciones tipo "toast" -->
  <div id="toast-root" class="toast-root" aria-live="assertive"></div>

  <!-- Definiciones SVG reutilizables (logo + íconos de línea) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <!-- Logo: el puente sobre el Dique Cabra Corral al atardecer, con los cerros salteños -->
      <linearGradient id="lm-cielo" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#A12A3A" />
        <stop offset="1" stop-color="#5E1422" />
      </linearGradient>
      <linearGradient id="lm-agua" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#2C8AA8" />
        <stop offset="1" stop-color="#175A73" />
      </linearGradient>
      <clipPath id="lm-clip"><rect x="2" y="2" width="60" height="60" rx="15" /></clipPath>
      <symbol id="logo-mark" viewBox="0 0 64 64">
        <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#lm-cielo)" />
        <g clip-path="url(#lm-clip)">
          <circle cx="46" cy="18" r="6.5" fill="#F4C46A" />
          <path d="M2 40 L14 25 L22 32 L32 20 L44 33 L52 27 L62 34 L62 46 L2 46 Z" fill="#CF8A2E" />
          <path d="M2 44 L11 37 L21 42 L31 36 L41 42 L51 37 L62 42 L62 47 L2 47 Z" fill="#A9552B" />
          <rect x="2" y="45" width="60" height="17" fill="url(#lm-agua)" />
          <rect x="2" y="39.5" width="60" height="3.6" fill="#FFF6EA" />
          <rect x="10.5" y="42" width="2.8" height="10" fill="#FFF6EA" />
          <rect x="22.5" y="42" width="2.8" height="10" fill="#FFF6EA" />
          <rect x="34.5" y="42" width="2.8" height="10" fill="#FFF6EA" />
          <rect x="46.5" y="42" width="2.8" height="10" fill="#FFF6EA" />
          <path d="M7 56h9M27 58.5h10M45 56h9" stroke="#FFFFFF" stroke-opacity=".45" stroke-width="1.5" stroke-linecap="round" />
        </g>
      </symbol>
    </defs>
  </svg>

  <!-- Configuración (se edita en config.js) -->
  <script src="config.js"></script>
  <!-- Generador de QR (offline) -> expone window.qrcode -->
  <script src="vendor/qrcode.min.js"></script>
  <!-- Aplicación (módulo ES) -->
  <script type="module" src="js/app.js"></script>

  <!-- Registro del Service Worker y actualización automática -->
  <script src="js/sw-registro.js"></script>
</body>
</html>
